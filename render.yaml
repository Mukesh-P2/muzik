services:
  - type: web
    name: muzik-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: YOUTUBE_API_KEY
        sync: false
